[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-profile"
version = "0.1.0"
description = "Launch Claude Code with isolated config directories per profile"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "QuickVM, LLC", email = "team@quickvm.com"}]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24.0",
    "rich>=14.1.0",
    "pydantic-settings>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "ty==0.0.84",
]

[project.scripts]
claude-profile = "claude_profile:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_profile"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented signature style builds each parameter with these calls.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint]
# AGENTS.md limits: cyclomatic complexity 8 per function and 100-character lines. The
# formatter keeps its own 88-column wrap.
extend-select = ["C901", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.per-file-ignores]
# main() relays through closures (complexity 19); the authenticated bridge rewrite replaces it.
"src/claude_profile/browser_bridge_host.py" = ["C901"]
